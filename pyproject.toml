# ADIS Python workspace.
#
# A single distribution ("adis") exposes two import roots:
#   apps.*      deployable services
#   packages.*  shared libraries
# Runtime dependencies are added in the phase that first imports them.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adis"
version = "0.1.0"
description = "ADIS Phase 1: sensing, telemetry collection and ingestion."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiokafka>=0.12,<0.15",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "httpx2>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "prometheus-client>=0.21,<1",
    # Agent collectors: the Windows Event Log (Windows only) and packet headers (PCAP, live).
    "pywin32>=306; sys_platform == 'win32'",
    "redis>=5.2,<9",
    "scapy>=2.6,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
# PEP 735 group; install with `pip install -e . --group dev` (pip >= 25.1).
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.hatch.build.targets.sdist]
include = ["apps", "packages", "README.md", "pyproject.toml"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "infrastructure",
    # Reference copies of other teams' Phase 1 work (not project code).
    "muna", "omran", "phase 1",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "S",     # bandit (security)
    "ASYNC", # async pitfalls
    "ANN",   # type annotations
    "D",     # docstrings
    "SIM",   # simplifications
    "C4",    # comprehensions
    "PT",    # pytest style
    "T20",   # no print statements
    "RUF",   # ruff-specific
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "D102", "D103"]
# Revision docstrings start with the free-text message passed to `alembic revision -m`.
"packages/database/migrations/versions/*.py" = ["D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "ml"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "tests"]
explicit_package_bases = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

# aiokafka ships no type information; it is wrapped behind typed Protocols.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# Agent collectors: pywin32 (Windows Event Log) and Scapy (packet headers) ship no type
# information; both are used behind typed collector code.
[[tool.mypy.overrides]]
module = ["win32evtlog", "pywintypes", "scapy", "scapy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "storage: needs the disposable Supabase Storage service; scripts/storage_test.py runs it",
    "integration: needs external services; skipped unless they are configured (e.g. TEST_DATABASE_URL)",
    "e2e: end-to-end verification that stops and restarts test containers; opt-in with TEST_E2E=1",
]

# --------------------------------------------------------------------------
# Coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["apps", "packages"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
