# Forward to the ADIS lab agent (172.31.250.10:5514):
# authentication logs as RFC 5424 over TCP (octet-counted), everything else as RFC 3164 over UDP.
auth,authpriv.* action(type="omfwd" target="172.31.250.10" port="5514" protocol="tcp"
                       template="RSYSLOG_SyslogProtocol23Format" TCP_Framing="octet-counted"
                       action.resumeRetryCount="-1" queue.type="LinkedList")
*.*;auth,authpriv.none action(type="omfwd" target="172.31.250.10" port="5514" protocol="udp")
