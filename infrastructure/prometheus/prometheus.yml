# Phase 1 ingestion metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: adis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: adis-normalizer
    metrics_path: /metrics
    static_configs:
      - targets: ["normalizer:9102"]
