# ADIS local infrastructure.
#
# - Every port binds to 127.0.0.1.
# - Secrets come from .env (see .env.example); there are no default passwords. Each
#   service checks its own secret when it starts, so starting one service never
#   requires the secrets of the others.
# - Kafka is transport and Redis is cache only. Supabase PostgreSQL is the source
#   of truth and is not run here (use a hosted project or the Supabase CLI).
#
# Profiles:
#   (none)         kafka, redis, prometheus, grafana
#   test           postgres-test: disposable plain PostgreSQL for integration tests
#   supabase-test  supabase-db-test: disposable Supabase Postgres (roles, grants, RLS)
#   app            the Phase 1 ingestion API and normalizer, restarted by Docker when they exit

name: adis-phase1-copy

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-app: &app
  <<: *hardening
  profiles: ["app"]
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  image: adis-phase1-copy:local
  # .env supplies the ADIS settings; addresses are overridden below, since "localhost"
  # inside a container is the container itself.
  env_file:
    - path: .env
      required: false
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: ["ALL"]
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    <<: *hardening
    # Pinned to 3.9.x until aiokafka compatibility with Kafka 4.x is verified.
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # Single-node KRaft (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: container-to-container. HOST: services running on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      # The HOST port is published on 127.0.0.1 only, so that is the address advertised:
      # "localhost" may resolve to ::1 first, where nothing listens (on Windows every
      # such attempt costs about 2 seconds per connection).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created explicitly, never implicitly by a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Disposable PostgreSQL for integration and end-to-end tests (TEST_DATABASE_URL) only.
  # It is plain PostgreSQL, not Supabase (no Auth, Storage or Data API roles), and it
  # starts only with the "test" profile. The image refuses to initialise without a
  # password.
  postgres-test:
    <<: *hardening
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      # Not named "adis": a role named like the schema makes it the default schema.
      POSTGRES_USER: adis_test
      POSTGRES_DB: adis_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adis_test -d adis_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Disposable Supabase Postgres (the image behind Supabase projects and the Supabase
  # CLI): its roles (postgres, anon, authenticated, service_role), grants and
  # extensions, for the Supabase fidelity tests. Auth, Storage and the Data API are not
  # run. Profile "supabase-test"; TEST_DATABASE_URL is then
  # postgresql://postgres:<TEST_SUPABASE_DB_PASSWORD>@127.0.0.1:55433/postgres
  supabase-db-test:
    <<: *hardening
    image: supabase/postgres:17.6.1.177
    profiles: ["supabase-test"]
    environment:
      POSTGRES_PASSWORD: ${TEST_SUPABASE_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${TEST_SUPABASE_DB_HOST_PORT:-55433}:5432"
    volumes:
      - supabase-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    # The password goes into a private config file, never onto a command line (where
    # any process listing would show it), and out of the server's environment. The
    # image's entrypoint then drops root and runs redis-server as "redis".
    # Transient state only: persistence is disabled on purpose.
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD must be set in .env" >&2; exit 1; }
        umask 077
        printf 'requirepass "%s"\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        unset REDIS_PASSWORD
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.1
    depends_on:
      prometheus:
        condition: service_healthy
    # Grafana would silently fall back to "admin" as the password: refuse instead.
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD must be set in .env" >&2; exit 1; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- ADIS services (profile "app"): docker compose --profile app up -d --build ------
  # Each retries Kafka (and the database) on its own at startup; Docker restarts them
  # if they ever exit. Topics must exist (make kafka-topics) and the database must be
  # migrated (make db-upgrade) first.

  api:
    <<: *app
    command: ["python", "-m", "apps.api"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Used only with API_RATE_LIMIT_BACKEND=redis.
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  normalizer:
    <<: *app
    command: ["python", "-m", "apps.normalizer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Reachable by Prometheus on the compose network only (no published port).
      NORMALIZER_HEALTH_HOST: 0.0.0.0
      NORMALIZER_HEALTH_PORT: 9102
      # SUPABASE_DB_URL comes from .env; a database on the host is host.docker.internal.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  kafka-data:
  postgres-test-data:
  supabase-db-test-data:
  prometheus-data:
  grafana-data:
